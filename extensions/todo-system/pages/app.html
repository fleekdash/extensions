<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo System - FleekDash</title>
    <script>
      (function preloadFleekDashTheme() {
        try {
          var cssHref = localStorage.getItem("fleekdash:globals-css");
          if (!cssHref && window.frameElement) {
            cssHref = window.frameElement.dataset.globalsCss;
          }
          if (cssHref) {
            var link = document.createElement("link");
            link.rel = "stylesheet";
            link.href = cssHref;
            document.head.appendChild(link);
          }
        } catch (error) {
          console.warn("[Todo System] Theme CSS preload skipped", error);
        }
      })();
    </script>
    <script
      src="/wp-content/plugins/fleekdash/public/sdk/fleekdash-sdk.js"
      vite-ignore
    ></script>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
